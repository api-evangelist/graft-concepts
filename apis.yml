name: Graft Concepts
description: >-
  Graft Concepts was a consumer-electronics accessories company best known for
  the "Leverage" modular iPhone case, a latched aluminum-and-polycarbonate bumper
  frame with interchangeable backplates that let owners swap in kickstands, bike
  mounts, and 3D-printed backs. The company was a Y Combinator startup based in
  the San Francisco Bay Area and was acquired by Inseego (formerly Novatel
  Wireless) in January 2014, after which the independent product and brand were
  wound down. This profile was surfaced by the venture-portfolio scraper and
  added to the API Evangelist network as a stub; enrichment found no live
  developer surface, API, SDK, or documentation for the company. The original
  graftconcepts.com domain no longer serves the company and now resolves to a
  parked content page, so there are no API artifacts to catalog.
